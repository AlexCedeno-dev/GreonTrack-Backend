name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de sintaxis
        run: |
          node --check app.js
          node --check routes/agent.routes.js
          node --check middlewares/agentAuth.middleware.js
          node --check controllers/agent.controller.js
          node --check data/mockStore.js

          
      - name: npm audit
        run: npm audit --audit-level=high

      # Gate: el pipeline falla si Trivy encuentra hallazgos HIGH/CRITICAL.
      - name: Trivy (fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'